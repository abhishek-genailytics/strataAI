services:
  # Backend API Service
  - type: web
    name: strataAI-backend
    env: python
    plan: free
    region: singapore
    branch: new_backend
    repo: https://github.com/abhishek-genailytics/strataAI
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://strataai.onrender.com,http://localhost:3000,http://localhost:5173,http://localhost:5174
      - key: REDIS_URL
        sync: false
    autoDeploy: true
    numInstances: 1

  # Frontend Static Site
  - type: static
    name: strataAI
    plan: starter
    region: singapore
    branch: new_backend
    repo: https://github.com/abhishek-genailytics/strataAI
    rootDir: frontend
    buildCommand: npm install; npm run build
    publishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://strataai-backend.onrender.com
    autoDeploy: true
    pullRequestPreviewsEnabled: false
